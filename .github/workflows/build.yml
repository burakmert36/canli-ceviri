name: IPA derle

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    # arm64 macOS makinelerinde kapasite sıkıntısı olduğunda Intel makineler kullanılır (iPhone için derleme aynıdır).
    runs-on: ${{ vars.BUILD_RUNNER || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarası
        run: |
          echo "VERSION=$(cat VERSION | tr -d '[:space:]').${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "MAJOR=$(cut -d. -f1 VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: En yeni Xcode'u seç
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Seçilen: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Derle
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project CanliCeviri.xcodeproj \
            -scheme CanliCeviri \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log

      - name: IPA paketle
        run: |
          APP=build/Build/Products/Release-iphoneos/CanliCeviri.app
          ls -la "$APP" "$APP/PlugIns"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry CanliCeviri.ipa Payload)
          ls -la out/CanliCeviri.ipa

      - name: SideStore kaynağı oluştur
        run: python3 scripts/make_source.py out/CanliCeviri.ipa "$VERSION" "${{ github.repository }}" > out/sidestore.json

      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" out/CanliCeviri.ipa out/sidestore.json \
            --title "Canlı Çeviri – Versiyon $MAJOR ($VERSION)" \
            --notes "Yüklemek için: CanliCeviri.ipa dosyasını iloader (Import IPA) ya da SideStore ile yükle." \
            --latest
          # Kullanıcının güvenli geri dönüş noktası: ilk çalışan sürüm.
          gh release edit v1.0.1 --title "Canlı Çeviri – Versiyon 1 (1.0.1) — güvenli yedek" \
            --notes "YouTube'da çalıştığı doğrulanan ilk sürüm. Sorun olursa bu IPA'yı yükleyerek geri dönebilirsin. Kaynak kod: versiyon-1 dalı." || true

      - name: Derleme özetini kaydet
        if: always()
        run: |
          mkdir -p /tmp/logs
          {
            echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}"
            if [ -f build.log ]; then
              grep -E "error:|fatal error|\*\* BUILD" build.log | sort -u | head -150
              echo "----- son 60 satır -----"
              tail -60 build.log
            fi
          } > /tmp/logs/build-summary.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git fetch origin build-logs || true
          git checkout -B build-logs
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/logs/build-summary.txt .
          git add build-summary.txt
          git commit -qm "build ${{ github.run_number }}: ${{ job.status }}" || true
          git push -f origin build-logs || true
