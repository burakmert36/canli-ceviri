name: CanliCeviri
options:
  bundleIdPrefix: com.canliceviri
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"

targets:
  CanliCeviri:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: Broadcast
        embed: true
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canliceviri.app
        PRODUCT_NAME: CanliCeviri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Canli Ceviri
        CFBundleName: Canli Ceviri
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Kamera ile TV ekranındaki altyazıları okuyup çevirmek için kullanılır.
        NSMicrophoneUsageDescription: Kamera/TV modunda TV'deki konuşmaları dinleyip çevirmek için kullanılır.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSpeechRecognitionUsageDescription: Telefonda çalan videolardaki konuşmaları yazıya dökmek için kullanılır.
        ITSAppUsesNonExemptEncryption: false

  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canliceviri.app.broadcast
        PRODUCT_NAME: Broadcast
        APPLICATION_EXTENSION_API_ONLY: "YES"
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Canli Ceviri
        CFBundleName: Canli Ceviri Yayin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
